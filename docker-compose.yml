services:
  app:
    build: .
    env_file: .env
    environment:
      CYBERINVESTIGATOR_ENV: development
      DATABASE_URL: postgresql+psycopg://cyberinvestigator:change-me@db:5432/cyberinvestigator
      TRUSTED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cyberinvestigator_instance:/app/instance
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cyberinvestigator
      POSTGRES_USER: cyberinvestigator
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberinvestigator -d cyberinvestigator"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - cyberinvestigator_db:/var/lib/postgresql/data
volumes:
  cyberinvestigator_instance:
  cyberinvestigator_db:
