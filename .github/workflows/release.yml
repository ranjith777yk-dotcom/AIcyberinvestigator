name: Container release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: Immutable release version
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

concurrency:
  group: release-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Release verification
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, attest, and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment || 'production' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: version
        run: echo "value=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - id: build-metadata
        name: Capture build time
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.value }}:${{ steps.version.outputs.value }}
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.value }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build-metadata.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.value }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Release summary
        run: |
          echo "### Published release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.image.outputs.value }}:${{ steps.version.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment gate: \`${{ inputs.environment || 'production' }}\`" >> "$GITHUB_STEP_SUMMARY"

  deployment-contract:
    name: Deployment contract
    needs: publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Confirm immutable delivery artifact
        run: |
          test -n "${{ needs.publish.outputs.digest }}"
          echo "The immutable image is ready for the environment-specific deployment adapter." >> "$GITHUB_STEP_SUMMARY"
          echo "No deployment target is configured in this repository; no runtime deployment is claimed." >> "$GITHUB_STEP_SUMMARY"
