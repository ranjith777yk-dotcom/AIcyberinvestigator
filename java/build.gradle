allprojects {
    group = "ai.cyberinvestigator"
    version = "0.1.0-SNAPSHOT"
}

subprojects {
    apply plugin: "java-library"

    repositories {
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 21
    }
}

project(":api") {
    dependencies {
        api project(":shared")
    }
}

configure([project(":plugins:apk"), project(":plugins:pdf"), project(":plugins:office"), project(":plugins:logs")]) {
    dependencies {
        api project(":shared")
        implementation project(":common")
    }
}
